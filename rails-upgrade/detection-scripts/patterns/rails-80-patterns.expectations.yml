# Fixture expectations for rails-80-patterns.yml.
#
# Keyed by variable_name. `match` lines the pattern MUST flag; `no_match` lines
# it MUST NOT flag. See rails-40-patterns.expectations.yml for the format.
#
# Run with:
#   bin/test-patterns rails-upgrade/detection-scripts/patterns/rails-80-patterns.yml

ENUM_KWARGS:
  match:
    - "  enum status: { active: 0, archived: 1 }, _prefix: true"
  no_match:
    - "  enum :status, { active: 0, archived: 1 }, prefix: true"

ENUM_KWARGS_MULTILINE:
  match:
    - "  enum("
    - "  enum(status: { active: 0, archived: 1 },"
  no_match:
    - "  enum(:status, { active: 0, archived: 1 }, prefix: true)"
    - "  enum :status, { active: 0 }"

URI_ESCAPE_REMOVED:
  match:
    - "    URI.escape(value)"
    - "    URI::decode(param)"
  no_match:
    - "    URI::RFC2396_PARSER.escape(value)"
    - "    Addressable::URI.escape(value)"
    - "    CGI.escape(value)"

URI_DEFAULT_PARSER_REGEXP:
  match:
    - "    url.match?(URI::DEFAULT_PARSER.regexp[:ABS_URI])"
  no_match:
    - "    url.match?(URI::RFC2396_PARSER.regexp[:ABS_URI])"

ROUTES_INVALID_ONLY_EXCEPT:
  match:
    - "  resources :offers, only: [:index, :show, :duplicate]"
    - "  resource :settings, except: :destroy"
  no_match:
    - "  resources :offers do"
